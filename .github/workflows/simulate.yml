name: ftmo-simulation

# Deux modes :
#  - cron toutes les 5 min (lun-ven 06:02-21:57 UTC), si le planificateur GitHub le déclenche ;
#  - mode boucle (workflow_dispatch avec loop=true) : un seul job exécute la simulation
#    toutes les 5 min jusqu'à 5 h 40 ou 21:58 UTC, puis se relance lui-même s'il reste
#    de la séance. Plan B car le planificateur GitHub ne déclenchait pas ce repo.
# Le retard éventuel est géré par run.py (rejeu des bougies, pas d'entrée périmée).
on:
  schedule:
    - cron: "2-59/5 6-21 * * 1-5"
  workflow_dispatch:
    inputs:
      loop: {description: "Mode boucle (true/false)", default: "false"}

permissions:
  contents: write
  actions: write

concurrency:
  group: ftmo-sim
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with: {path: .tg_chat, key: tg-chat-v1}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Simulation (paper trading)
        env:
          LOOP: ${{ inputs.loop == 'true' }}
        run: |
          git config user.name "ftmo-sim-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tick() {
            git pull -q --rebase -X theirs origin main || true
            python run.py || echo "run.py a échoué (on continue)"
            git add state data RAPPORT.md docs
            if ! git diff --cached --quiet; then
              git commit -q -m "sim: $(date -u +'%Y-%m-%d %H:%M') UTC"
              for i in 1 2 3 4; do git push -q && break; sleep $((i*5)); git pull -q --rebase -X theirs origin main || true; done
            fi
          }
          start=$(date +%s)
          while true; do
            tick
            [ "$LOOP" = "true" ] || break
            now=$(date +%s); hm=$(date -u +%H%M)
            if [ $((now - start)) -gt 20400 ] || [ "$hm" -ge 2158 ] || [ "$(date -u +%u)" -gt 5 ]; then break; fi
            if python -c "import json,sys; sys.exit(0 if json.load(open('state/state.json')).get('test_finished') else 1)"; then break; fi
            sleep $(( 300 - $(date +%s) % 300 + 60 ))   # prochaine minute x1 (bougie 5 min clôturée + délai Yahoo)
          done

      - name: Bilan du jour sur Telegram (infographie, + rapport en fin de test)
        if: ${{ always() }}
        continue-on-error: true
        env:
          TELEGRAM_KEY: ${{ secrets.TELEGRAM_KEY }}
        run: |
          [ -n "$TELEGRAM_KEY" ] || exit 0
          day=$(python -c "import json;print(json.load(open('state/state.json'))['day'])")
          fin=$(python -c "import json;print(1 if json.load(open('state/state.json')).get('test_finished') else 0)")
          hm=$(date -u +%H%M)
          mark="state/notified_$day"
          if { [ "$hm" -ge 2150 ] || [ "$fin" = 1 ]; } && [ ! -f "$mark" ]; then
            git pull -q --rebase -X theirs origin main || true
            python tools/notify.py --photo "$(python tools/infographic.py)" "Bilan du jour — FTMO paper trading"
            if [ "$fin" = 1 ]; then python tools/notify.py --report "Test terminé : rapport complet"; fi
            touch "$mark"; git add "$mark"; git commit -q -m "notif: $day"
            for i in 1 2 3; do git push -q && break; sleep 5; git pull -q --rebase -X theirs origin main; done
          fi

      - name: Relance de la boucle (si séance pas finie)
        if: ${{ inputs.loop == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          hm=$(date -u +%H%M); dow=$(date -u +%u)
          if python -c "import json,sys; sys.exit(0 if json.load(open('state/state.json')).get('test_finished') else 1)"; then exit 0; fi
          if [ "$dow" -le 5 ] && [ "$hm" -lt 2150 ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/simulate.yml/dispatches" -f ref=main -f 'inputs[loop]=true'
          fi

      - name: Arrêt automatique après la date de fin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python -c "import json,sys; s=json.load(open('state/state.json')); sys.exit(0 if s.get('test_finished') else 1)"; then
            echo "Test terminé : désactivation du workflow."
            gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/simulate.yml/disable" || true
          fi
