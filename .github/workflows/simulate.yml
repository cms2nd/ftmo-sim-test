name: ftmo-simulation

# Toutes les 5 min, lun-ven, 06:00-21:55 UTC (sessions Londres + New York).
# Le cron GitHub peut avoir plusieurs minutes de retard: run.py en tient compte.
on:
  schedule:
    - cron: "*/5 6-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ftmo-sim
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Exécution de la simulation (paper trading)
        run: python run.py

      - name: Commit de l'état
        run: |
          git config user.name "ftmo-sim-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state data RAPPORT.md docs
          git diff --cached --quiet && exit 0
          git commit -m "sim: $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3 4; do
            git push && exit 0
            sleep $((i * 5)); git pull --rebase -X theirs || true
          done
          exit 1

      - name: Arrêt automatique après la date de fin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python -c "import json,sys; s=json.load(open('state/state.json')); sys.exit(0 if s.get('test_finished') else 1)"; then
            echo "Test terminé : désactivation du workflow."
            gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/simulate.yml/disable" || true
          fi
