name: dukascopy-download

# Lancement manuel : télécharge les ticks Dukascopy (gratuits) en parallèle,
# un job par instrument, puis commite data/duka/ (bougies 5 min + spread réel).
on:
  workflow_dispatch:
    inputs:
      start: {description: "Date de début (AAAA-MM-JJ)", default: "2026-09-01"}
      end: {description: "Date de fin (AAAA-MM-JJ)", default: "2026-11-20"}

permissions:
  contents: write

concurrency:
  group: dukascopy
  cancel-in-progress: true

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        sym: [US100, US30, GER40, XAUUSD, EURUSD, GBPUSD]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python tools/dukascopy.py --start ${{ inputs.start }} --end ${{ inputs.end }} --symbols ${{ matrix.sym }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "duka-${{ matrix.sym }}", path: data/duka/}

  commit:
    needs: download
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: data/duka, pattern: "duka-*", merge-multiple: true}
      - run: |
          ls -la data/duka
          git config user.name "ftmo-sim-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/duka
          git diff --cached --quiet && exit 0
          git commit -m "data: ticks Dukascopy ${{ inputs.start }} → ${{ inputs.end }}"
          for i in 1 2 3 4; do git push && exit 0; sleep $((i*5)); git pull --rebase -X theirs || true; done
          exit 1
