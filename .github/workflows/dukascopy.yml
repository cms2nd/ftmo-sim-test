name: dukascopy-download

# Lancement manuel uniquement : télécharge les ticks Dukascopy (gratuits) et les
# convertit en bougies 5 min avec spread réel, puis commite data/duka/.
on:
  workflow_dispatch:
    inputs:
      start: {description: "Date de début (AAAA-MM-JJ)", default: "2026-09-01"}
      end: {description: "Date de fin (AAAA-MM-JJ)", default: "2026-11-20"}
      probe: {description: "Test d'accès uniquement (true/false)", default: "true"}

permissions:
  contents: write

concurrency:
  group: ftmo-sim
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Test d'accès
        run: python tools/dukascopy.py --start ${{ inputs.start }} --end ${{ inputs.end }} --probe
      - name: Téléchargement complet
        if: ${{ inputs.probe != 'true' }}
        run: python tools/dukascopy.py --start ${{ inputs.start }} --end ${{ inputs.end }}
      - name: Commit
        if: ${{ inputs.probe != 'true' }}
        run: |
          git config user.name "ftmo-sim-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/duka
          git diff --cached --quiet && exit 0
          git commit -m "data: ticks Dukascopy ${{ inputs.start }} → ${{ inputs.end }}"
          for i in 1 2 3 4; do git push && exit 0; sleep $((i*5)); git pull --rebase -X theirs || true; done
          exit 1
