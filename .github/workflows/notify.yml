name: notify
on:
  workflow_dispatch:
    inputs:
      message:
        description: "Texte à envoyer (vide = résumé du rapport)"
        required: false
        default: ""
  workflow_call:
    inputs:
      message: {type: string, required: false, default: ""}
    secrets:
      TELEGRAM_KEY: {required: true}
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with: {path: .tg_chat, key: tg-chat-v1}
      - name: Envoi Telegram
        env:
          TELEGRAM_KEY: ${{ secrets.TELEGRAM_KEY }}
          MSG: ${{ inputs.message }}
        run: |
          if [ -z "$MSG" ]; then MSG="$(head -c 3500 docs/notify.txt 2>/dev/null || echo 'FTMO sim : voir RAPPORT.md')"; fi
          printf '%s\n\nhttps://github.com/${{ github.repository }}/blob/main/RAPPORT.md' "$MSG" | python tools/notify.py -
